# https://peps.python.org/pep-0517/
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# https://peps.python.org/pep-0621/
[project]
name = "goto-swap"
# versioning through releases
description = "A unified, lightweight API for sliced Wasserstein image targets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD 3-Clause License" }
authors = [
    { email = "minhuanli@flatironinstitute.org", name = "Minhuan Li" },
    { email = "geoffwoollard@gmail.com",         name = "Geoffrey Woollard" },
    { email = "dherreros@cnb.csic.es",           name = "David Herreros" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dynamic = ["version"]
# version='0.0.1'

dependencies = [
    "numpy>=1.20.0",
    # Backend-specific dependencies are now optional
]

# extras
# https://peps.python.org/pep-0621/#dependencies-optional-dependencies
[project.optional-dependencies]
# JAX backend dependencies
jax = [
    "jax>=0.4.0",
    "dm_pix>=0.4.0", 
    "flax>=0.7.0",
]

# PyTorch backend dependencies  
pytorch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

# All backends
all = [
    "jax>=0.4.0",
    "dm_pix>=0.4.0", 
    "flax>=0.7.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

# Development dependencies
test = ["pytest>=6.0", "pytest-cov", "pot", "scikit-learn"]

docs = [
    "sphinx",
    "myst_parser",
    "sphinxcontrib_autoprogram",
    "sphinx_rtd_theme"
]

[project.urls]
homepage = "https://flatironinstitute.github.io/GOTO-SWAP/"
repository = "https://github.com/flatironinstitute/GOTO-SWAP"

# same as console_scripts entry point
# [project.scripts]


# https://hatch.pypa.io/latest/config/metadata/
[tool.hatch.version]
source = "vcs"

