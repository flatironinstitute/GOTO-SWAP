setup:
    specimen:
        pdb_file: "1uao_assembly.pdb"
        selection_string: "not element H"
        center: true
        
    noise:
        dose: 10
        background: 100
    image:
        grid_size: 64
        pixel_size: 0.5
        pad_size: 128 
    integrator:
        atom_width: 0.25
        atom_amplitude: 1.0
    pose:
        rotation: [0.0, 0.0, 0.0]
        translation: [0.0, 0.0]
    ctf:
        defocus_in_angstroms: 2000.0
        voltage: 300.0
    envelope:
        amplitude: 1.0
        b_factor: 10.0
    cv:
        type: tear
        value: 0.0
optimization:
    learning_rate: 0.01
    n_iterations: 1000
    print_every: 1
    sliced_wasserstein:
        n_projections: 30
        n_pixels: 300
        normalize_safely_epsilon: 1e-8
    preconditioner:
      defocus_to_cv_ratio: 100000.0
        

inference_model:
    noise:
        dose: ${setup.noise.dose}
        background: ${setup.noise.background}
    initial_estimates:
        cv:
            type: ${setup.cv.type}
            value: 0.0
        rotation: [5.0, 5.0, 5.0]
        translation: [1.0, 1.0]
        ctf:
            defocus_in_angstroms: 1900.0
            voltage: ${setup.ctf.voltage}
    integrator:
        atom_width: ${setup.integrator.atom_width}
        atom_amplitude: ${setup.integrator.atom_amplitude}