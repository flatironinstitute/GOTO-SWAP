setup:
    specimen:
        pdb_file: "1uao_assembly.pdb"
        selection_string: "not element H"
        center: true
        
    noise:
        dose: 10
        background: 100
    image:
        grid_size: 64
        pixel_size: 0.5
        pad_size: 128 
    integrator:
        atom_width: 0.25
        atom_amplitude: 1.0
    pose:
        euler_angles_deg:
          phi_angle: 0.0
          theta_angle: 0.0
          psi_angle: 0.0
        translation:
          offset_x_in_angstroms: 0
          offset_y_in_angstroms: 0.0
    ctf:
        defocus_in_angstroms: 2000.0
        voltage: 300.0
    envelope:
        amplitude: 1.0
        b_factor: 10.0
    cv:
        type: tear
        value: 0.0


optimization:
    learning_rate: 0.01
    n_iterations: 1000
    print_every: 10
    sliced_wasserstein:
        n_projections: 30
        n_pixels: 300
        normalize_safely_epsilon: 1e-8
    preconditioner:
      cv: 0.1
      defocus: 1000.0
      quaternion: 0.001
      offset: 0.1
    optimize_these_variables:
      cv: false
      defocus: false
      rotation: true
      translation: false


inference_model:
    noise:
        dose: ${setup.noise.dose}
        background: ${setup.noise.background}
    initial_estimates:
        cv:
            type: ${setup.cv.type}
            value: ${setup.cv.value}
        pose:
            euler_angles_deg:
              phi_angle: 0
              theta_angle: 0
              psi_angle: 0.5
            translation:
              offset_x_in_angstroms: ${setup.pose.translation.offset_x_in_angstroms}
              offset_y_in_angstroms: ${setup.pose.translation.offset_y_in_angstroms}
        ctf:
            defocus_in_angstroms: ${setup.ctf.defocus_in_angstroms}
            voltage: ${setup.ctf.voltage}
    integrator:
        atom_width: ${setup.integrator.atom_width}
        atom_amplitude: ${setup.integrator.atom_amplitude}