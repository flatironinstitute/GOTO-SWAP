setup:
    specimen:
        pdb_file: "1uao_assembly.pdb"
        atomic_number_exclusion: [1]
        center: true
        
    noise:
        dose: 10
        background: 100
    image:
        grid_size: 32
        pixel_size: 0.5
        pad_size: 64 
    integrator:
        # grid_size: 64
        # pixel_size: 1.0
        atom_width: 0.5
        atom_amplitude: 1.0
    pose:
        rotation: [0.0, 0.0, 0.0]
        translation: [0.0, 0.0]
    ctf:
        defocus_u: 1.5e4
        defocus_v: ${setup.ctf.defocus_u}
        astigmatism_angle: 0.0
        cs: 2.0
        voltage: 300.0
        amplitude_contrast: 0.1
    cv:
        type: tear
        value: 2.5
optimization:
    learning_rate: 3e-3
    n_iterations: 100
    print_every: 1
    sliced_wasserstein:
        n_projections: 30
        n_pixels: 100

inference_model:
    noise:
        dose: ${setup.noise.dose}
        background: ${setup.noise.background}
    initial_estimates:
        cv:
            type: ${setup.cv.type}
            value: 0.0
        rotation: [5.0, 5.0, 5.0]
        translation: [1.0, 1.0]
        ctf:
            defocus_u: 1.4e5
            defocus_v: ${inference_model.initial_estimates.ctf.defocus_u}
            astigmatism_angle: ${setup.ctf.astigmatism_angle}
            cs: ${setup.ctf.cs}
            voltage: ${setup.ctf.voltage}
            amplitude_contrast: ${setup.ctf.amplitude_contrast}
    integrator:
        atom_width: ${setup.integrator.atom_width}
        atom_amplitude: ${setup.integrator.atom_amplitude}