setup:
    specimen:
        pdb_file: "1uao_assembly.pdb"
        selection_string: "not element H"
        center: true
    noise:
        dose: 1e3
        background: 0
    image:
        grid_size: 128
        pixel_size: 0.5
        pad_size: 128 
    integrator:
        atom_width: 0.25
        atom_amplitude: 1.0
    pose:
        euler_angles_deg:
          phi_angle: 0.0
          theta_angle: 0.0
          psi_angle: 0.0
        translation:
          offset_x_in_angstroms: 0.0
          offset_y_in_angstroms: 0.0
    ctf:
        defocus_in_angstroms: 2000.0
        voltage: 300.0
    envelope:
        amplitude: 1.0
        b_factor: 10.0
    cv:
        type: tear
        value: 0.0


optimization:
    learning_rate: 1
    n_iterations: 3000
    print_every: 10
    use_this_objective: sw_dsort
    sliced_wasserstein:
        n_projections: 50
        n_pixels: 1000
        normalize_safely_epsilon: 1e-8
    preconditioner: 
      l2: # lr 1
        cv: 0.1
        defocus: 1000.0
        quaternion: 0.0001
        offset: 0.1
      sw: # sw with lr 0.01 and n_iterations 100 np 30, np 300
        cv: 300.0
        defocus: 1000000.0 # maybe higher?
        quaternion: 0.1
        offset: 100.0
      sw_cdf: # lr: 1
        cv: 5e4
        defocus: 1e9
        quaternion: 1e2
        offset: 1e4
      sw_icdf: # lr: 1
        cv: 5e1
        defocus: 1e6
        quaternion: 0.5
        offset: 1e2
      sw_dsort: # lr: 1
        cv: 1e2
        defocus: 1e7
        quaternion: 0.1
        offset: 5e1
    optimize_these_variables:
      cv: true
      defocus: true
      rotation: true
      translation: true


inference_model:
    noise:
        dose: ${setup.noise.dose}
        background: ${setup.noise.background}
    initial_estimates:
        cv:
            type: ${setup.cv.type}
            value: 4 #${setup.cv.value}
        pose:
            euler_angles_deg:
              phi_angle: 3 #${setup.pose.euler_angles_deg.phi_angle}
              theta_angle: 3 # ${setup.pose.euler_angles_deg.theta_angle}
              psi_angle: 3 #${setup.pose.euler_angles_deg.psi_angle}
            translation:
              offset_x_in_angstroms: 4 #${setup.pose.translation.offset_x_in_angstroms}
              offset_y_in_angstroms: 4 # ${setup.pose.translation.offset_y_in_angstroms}
        ctf:
            defocus_in_angstroms: 2100 #${setup.ctf.defocus_in_angstroms}
            voltage: ${setup.ctf.voltage}
    integrator:
        atom_width: ${setup.integrator.atom_width}
        atom_amplitude: ${setup.integrator.atom_amplitude}