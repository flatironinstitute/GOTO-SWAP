objective:
  use_this_objective: ???
  sliced_wasserstein_random_pixels:
    crop_to_box_size: 64
    n_projections: ???
    n_pixels: ???
    random_seed: 42
    n_projections_chunk_size: ${objective.sliced_wasserstein_random_pixels.n_projections}  # set to n_projections for no chunking

  sliced_wasserstein_cdf:
    n_projections: 1000
    crop_to_box_size: 64

  sliced_wasserstein_icdf:
    n_projections: 1000
    n_interpolation_points: 999
    crop_to_box_size: 64

  sliced_wasserstein_dsort:
    n_projections: 1000
    crop_to_box_size: 64

  emd:
    crop_to_box_size: 64
    kwargs:
      numItermax: 1000000
landscape:
  # n_trials_per_point: 3
  # n_landscape_values: 4
  n_trials: 1
  n_trials_chunks: 10
  landscape_variables:
    # cv:
    #   min_value: 0
    #   max_value: 5
    #   n_points: 10
    rotation:
      axis: [1.0, 1, 1]
      min_geodesic_angle_in_degrees: 0.0
      max_geodesic_angle_in_degrees: 180.0
      n_points: 100
      # concentration: [1, 0, 0, 0.0]
      # n_batch: 100
    # defocus:
    #   min_value_in_angstroms: 2000.0
    #   max_value_in_angstroms: 2000.0
    #   n_points: 4
    offset_x_in_angstroms:
      min_value_in_angstroms: -5.0
      max_value_in_angstroms: 5.0
      n_points: 100
    
setup:
  specimen:
      pdb_file: "1uao_assembly.pdb"
      selection_string: "not element H"
      center: true
  noise:
      dose: 100
      background: 1
      random_seed: 0
  image:
      grid_size: 128
      pixel_size: 0.5
      pad_size: 128 
  integrator:
      atom_width: 0.25
      atom_amplitude: 1.0
  pose:
      euler_angles_deg:
        phi_angle: 0.0
        theta_angle: 0.0
        psi_angle: 0.0
      translation:
        offset_x_in_angstroms: 0.0
        offset_y_in_angstroms: 0.0
  ctf:
      defocus_in_angstroms: 2000.0
      voltage: 300.0
  envelope:
      amplitude: 1.0
      b_factor: 10.0
  cv:
      type: tear
      value: 0.0