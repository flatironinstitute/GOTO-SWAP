[tool:pytest]
# Pytest configuration for GOTO-SWAP

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for backend-specific tests
markers =
    jax: mark test as requiring JAX backend
    pytorch: mark test as requiring PyTorch backend
    backend: mark test as backend-specific
    slow: mark test as slow running

# Test execution options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Minimum version
minversion = 6.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning:goto_swap.base
    ignore::UserWarning
